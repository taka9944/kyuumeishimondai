<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>救命士ミニテスト演習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: phone-first single column. Setup (分野・問題数) -> one question per screen -> result & review.
   Identity: the white ambulance body with its red side stripe; navy ink, red used only for the stripe and wrong answers. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --ink:#132235; --muted:#55657a; --line:#d2dae4; --chip:#e3e9f0;
  --accent:#1c4f93; --accent-ink:#ffffff; --stripe:#c8202f;
  --fig:#ffffff; --ok:#1d7a4c; --ok-bg:#e1f2e8; --ng:#b4232f; --ng-bg:#fbe4e5; --case:#f4f7fa;
  --f-disp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1520; --surface:#162231; --ink:#e4ebf3; --muted:#9aabbf; --line:#2a3a4d; --chip:#203043;
  --accent:#8db8f0; --accent-ink:#0b1626; --stripe:#e5545e;
  --ok:#6fd3a0; --ok-bg:#143528; --ng:#f2949a; --ng-bg:#3d1c20; --case:#1b2938; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1520; --surface:#162231; --ink:#e4ebf3; --muted:#9aabbf; --line:#2a3a4d; --chip:#203043;
  --accent:#8db8f0; --accent-ink:#0b1626; --stripe:#e5545e;
  --ok:#6fd3a0; --ok-bg:#143528; --ng:#f2949a; --ng-bg:#3d1c20; --case:#1b2938; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.wrap{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.brand{display:flex;flex-direction:column;gap:4px;padding-top:6px}
.stripe{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--stripe) 0 72%,transparent 72% 76%,var(--stripe) 76% 100%)}
h1{font-family:var(--f-disp);font-weight:900;font-size:1.6rem;line-height:1.3;margin:8px 0 0;letter-spacing:.02em;text-wrap:balance}
h2{font-family:var(--f-disp);font-weight:700;font-size:1.1rem;margin:0}
.lead{color:var(--muted);margin:0;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.lab{font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
.group{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .c{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.8}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:.85rem;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{width:100%;min-height:54px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{min-height:46px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;flex:1 1 140px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:.74rem;background:var(--chip);border-radius:5px;padding:1px 8px;color:var(--muted)}
.case{background:var(--case);border-left:4px solid var(--line);border-radius:6px;padding:10px 12px;font-size:.95rem}
.case p{margin:0 0 6px}.case p:last-child{margin:0}
figure{margin:0;background:var(--fig);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-x:auto}
figure img{display:block;margin:0 auto;max-width:100%;height:auto}
.stem{font-size:1.06rem;margin:0;text-wrap:pretty;font-weight:700}
.stem .sel{font-weight:400;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;min-height:52px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.98rem;line-height:1.6;cursor:pointer;width:100%}
.opt .n{flex:none;width:1.4em;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.opt .x{min-width:0}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ng{border-color:var(--ng);background:var(--ng-bg)}
.opt[disabled]{cursor:default}
.verdict{font-family:var(--f-disp);font-weight:900;font-size:1.25rem}.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.ans{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.93rem;margin:0}
.ans dt{color:var(--muted);font-size:.8rem;font-weight:700;padding-top:2px;white-space:nowrap}
.ans dd{margin:0;min-width:0}
.src{font-variant-numeric:tabular-nums}
.score{font-family:var(--f-disp);font-weight:900;font-size:2.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.score small{font-size:1rem;color:var(--muted);font-weight:700}
.rev{display:flex;flex-direction:column;gap:8px}
.rev details{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 12px}
.rev summary{cursor:pointer;font-size:.92rem}
.rev .mk{font-weight:700;margin-right:6px}.rev .mk.ok{color:var(--ok)}.rev .mk.ng{color:var(--ng)}
.rev .body{display:flex;flex-direction:column;gap:6px;padding-top:8px;font-size:.92rem}
.rev ol{margin:0;padding-left:1.4em}.rev li.a{color:var(--ok);font-weight:700}.rev li.w{color:var(--ng);text-decoration:line-through}
.note{font-size:.78rem;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>

<script>
var DATA=[{"t":"生命倫理の４原則：善行の原則","cat":"社会保障・医療倫理","q":"生命倫理の４原則における善行の原則にあてはまるのはどれか。","r":["71-1-1","70-1-7","70-2-5"],"pp":[10],"modes":["pos"],"T":[{"x":"正しい医療行為を実践する。","o":0},{"x":"意識のない傷病者に救急救命処置を行う。","o":1}],"F":[{"x":"かたよりのない医療情報を提供する。","o":2},{"x":"傷病者の医療へのアクセスを平等にする。","o":3},{"x":"苦痛をできるだけ与えない。","o":4},{"x":"傷病者の意思を優先する。","o":5},{"x":"手袋を使用して傷病者に触れる。","o":6},{"x":"人としての尊厳を尊重する。","o":7},{"x":"自己決定権を尊重する。","o":8}],"c":[]},{"t":"生命倫理に関する宣言・用語の組合せ","cat":"社会保障・医療倫理","q":"生命倫理に関する組合せで正しいのはどれか。","r":["71-1-2","70-1-11"],"pp":[12],"modes":["pos"],"T":[{"x":"リスボン宣言 ―― 患者の権利","o":0}],"F":[{"x":"ジュネーブ宣言 ―― インフォームドコンセント","o":1},{"x":"ヘルシンキ宣言 ―― パターナリズム","o":2},{"x":"リビングウイル ―― 医師の倫理規範","o":3},{"x":"ヒポクラテスの誓い ―― 日常生活の質","o":4}],"c":[]},{"t":"ヘルシンキ宣言","cat":"社会保障・医療倫理","q":"ヘルシンキ宣言で述べられているのはどれか。","r":["70-2-1"],"pp":[11],"modes":["pos"],"T":[{"x":"インフォームドコンセント取得の必要性","o":0}],"F":[{"x":"患者の権利","o":1},{"x":"患者の健康を考慮すること","o":2},{"x":"人道的立場にのっとった医の実践","o":3},{"x":"患者の秘密厳守","o":4}],"c":[]},{"t":"患者の権利が示された宣言","cat":"社会保障・医療倫理","q":"患者の権利が示されているのはどれか。","r":["70-3-3"],"pp":[12],"modes":["pos"],"T":[{"x":"リスボン宣言","o":0}],"F":[{"x":"ジュネーブ宣言","o":1},{"x":"ヘルシンキ宣言","o":2},{"x":"国連憲章","o":3},{"x":"ニュールンベルグ綱領","o":4}],"c":[]},{"t":"アドバンスディレクティブ","cat":"社会保障・医療倫理","q":"将来自らが判断能力を失った際に、自分に行われる医療行為に対する意向を前もって意思表示することはどれか。","r":["71-2-3"],"pp":[13],"modes":["pos"],"T":[{"x":"アドバンスディレクティブ","o":0}],"F":[{"x":"クオリティオブライフ","o":1},{"x":"後見人契約","o":2},{"x":"パターナリズム","o":3},{"x":"インフォームドコンセント","o":4}],"c":[]},{"t":"アドバンス・ケア・プランニング（ACP）","cat":"救急医療体制・救急救命士","q":"アドバンス・ケア・プランニング（ACP）について正しいのはどれか。","r":["71-1-9","71-11-10","71-17-5","70-3-5","70-12-11","70-40-2","70-43-4"],"pp":[13,251],"modes":["pos"],"T":[{"x":"本人の人生観を尊重する。","p":13,"o":0},{"x":"医療・ケアチームと本人とで繰り返し話し合う。","o":1}],"F":[{"x":"安楽死を選択できる。","o":2},{"x":"DNAR指示のことである。","o":3},{"x":"70歳以上が対象となる。","o":4},{"x":"本人と弁護士で作成する。","o":5},{"x":"本人以外の家族がいることを前提とする。","o":6},{"x":"DNARは事前の意思表示があることを前提とする。","o":7},{"x":"本人の意思が確認できない場合は家族の意思による。","o":8},{"x":"DNARは心肺停止以外でも有効である。","o":9},{"x":"本人の意思が確認できない場合は家族にとって最善の方針をとる。","o":10}],"c":[]},{"t":"人生の最終段階における医療","cat":"救急医療体制・救急救命士","q":"人生の最終段階における医療について正しいのはどれか。","r":["70-47-19"],"pp":[251],"modes":["pos"],"T":[{"x":"DNAR指示は心肺停止時のみに有効である。","o":0}],"F":[{"x":"老衰は減少し不慮の事故が増加している。","o":1},{"x":"DNAR指示は本人の意思が変化しても引き続き踏襲される。","o":2},{"x":"本人が意思表明できない場合の代理判断をリビングウイルという。","o":3},{"x":"ACP（アドバンス・ケア・プランニング）は「人生相談」と呼ばれている。","o":4}],"c":[]},{"t":"インフォームドコンセント","cat":"救急医療体制・救急救命士","q":"救急救命士が行うインフォームドコンセントについて正しいのはどれか。","r":["71-1-10","71-6-12","71-11-9","70-47-16"],"pp":[13,249],"modes":["pos","neg"],"T":[{"x":"傷病者が自らの意思に基づいて決定する。","p":13,"o":0},{"x":"医療機関選定にも適応される。","o":1},{"x":"時間的に余裕がない場合は事後に説明を行う。","o":2},{"x":"傷病者と家族とが正確に内容を理解できるように説明する。","o":3}],"F":[{"x":"パターナリズムの考え方に基づいて決定する。","o":4},{"x":"倫理的に正しいことを説明する。","p":13,"o":5},{"x":"人の尊厳が最高原理との考えに基づく。","p":13,"o":6},{"x":"ジュネーブ宣言において言及されている。","p":13,"o":7},{"x":"時間的余裕のない場合に説明は不要である。","p":13,"o":8}],"c":[],"n":"救急救命士が行うインフォームドコンセントについて適切でないのはどれか。"},{"t":"生命倫理（症例）：過剰服薬の傷病者の搬送","cat":"社会保障・医療倫理","q":"本人の意思表示があったにもかかわらず救急隊が搬送した行動は、生命倫理に関する原則のどれに該当するか。","r":["71-2-7"],"pp":[10],"modes":["pos"],"T":[{"x":"善行の原則","o":0}],"F":[{"x":"公正・正義の原則","o":1},{"x":"自律の尊重","o":2},{"x":"人間の尊厳","o":3},{"x":"無危害の原則","o":4}],"c":["22歳の女性。数年来、双極性障害で通院している。過剰服薬による救急搬送も複数回あり、現在は自宅療養中で両親と同居している。母親が部屋に行くと、呼名に反応がなく、「死なせてほしい」というメモと多数の薬の空シートがあったため、救急要請した。","救急隊到着時観察所見：意識JCS100。呼吸数12/分。脈拍52/分。血圧78/56mmHg。嘔吐の痕跡もあった。救急隊は重症と判断し、三次救急医療機関への搬送を行った。"]},{"t":"生命倫理（症例）：事前指示書への配慮","cat":"社会保障・医療倫理","q":"この事前指示書に配慮した救急活動を行うことは生命倫理のどの原則に基づくものか。","r":["70-3-1"],"pp":[10],"modes":["pos"],"T":[{"x":"自律尊重の原則","o":0}],"F":[{"x":"善行の原則","o":1},{"x":"無危害の原則","o":2},{"x":"公正と正義の原則","o":3},{"x":"誠実と忠誠の原則","o":4}],"c":["86歳の男性。かつて弁護士であったが、認知症となり日常生活動作が低下し、半年前から会話もできなくなった。１か月前から嚥下時にむせこみがみられるようになり、本日発熱して息苦しそうになったため、妻が救急要請した。","救急隊到着時観察所見：意識JCS10。呼吸数36/分。脈拍120/分、整。血圧110/60mmHg。SpO2値78％。右肺に湿性ラ音を聴取する。妻が本人直筆の事前指示書を提示し、そこには、望まない医療処置として「人工呼吸器、人工的栄養補給、心肺蘇生術」が記載されている。"]},{"t":"生命倫理（症例）：DNARとかかりつけ医の到着待ち","cat":"救急医療体制・救急救命士","q":"この救急隊が現場で待機したことは「生命倫理に関する原則」のどれに該当するか。","r":["71-11-8","71-17-4","70-12-12","70-43-11","70-47-3"],"pp":[252],"modes":["pos"],"T":[{"x":"自律の尊重","o":0}],"F":[{"x":"公正の原則","o":1},{"x":"善行の原則","o":2},{"x":"正義の原則","o":3},{"x":"無危害の原則","o":4}],"c":["92歳の男性。介護施設入所中。数日前から衰弱が進行し、本人と家族との希望で施設で看取る予定であった。本日朝、突然痙攣を起こしたため、あわてた職員が救急要請した。","救急隊到着時観察所見：心肺停止状態で、職員により一次救命処置が行われている。心肺蘇生を続けたが、心電図では心静止が続いている。DNARの事前指示書がみつかったため、かかりつけ医に連絡したところ、「すぐに向かう」と回答を得たため、現場で待機した。"]},{"t":"臓器提供が可能な併存症","cat":"社会保障・医療倫理","q":"臓器提供が可能な併存症はどれか。","r":["71-2-8","71-6-1"],"pp":[13],"modes":["pos"],"T":[{"x":"原発性脳腫瘍","o":0}],"F":[{"x":"HBs抗原陽性","o":1},{"x":"進行大腸癌","o":2},{"x":"溶血症","o":3},{"x":"クロイツフェルト・ヤコブ病","o":4}],"c":[]},{"t":"脳死臓器移植","cat":"社会保障・医療倫理","q":"脳死臓器移植について正しいのはどれか。","r":["71-2-10","71-6-7"],"pp":[13],"modes":["pos"],"T":[{"x":"本人の生前意志が明白であっても家族は拒否できる。","o":0}],"F":[{"x":"15歳未満の子供でも本人の意思があれば可能である。","o":1},{"x":"移植用臓器の摘出は心拍が止まった状態で行われる。","o":2},{"x":"被虐待児からの臓器摘出は可能である。","o":3},{"x":"一般社会において脳死はすべて人の死と認識されている。","o":4}],"c":[]},{"t":"法的脳死判定基準","cat":"社会保障・医療倫理","q":"法的脳死判定基準に含まれるのはどれか。","r":["70-2-12"],"pp":[13],"modes":["neg"],"T":[{"x":"脳幹反射の消失","o":0},{"x":"自発呼吸の消失","o":1},{"x":"深昏睡（JCS300）","o":2},{"x":"瞳孔固定と散大（４mm以上）","o":3}],"F":[{"x":"心電図波形平坦","o":4}],"c":[],"n":"法的脳死判定基準について誤っているのはどれか。"},{"t":"医療計画の６事業","cat":"社会保障・医療倫理","q":"都道府県によって策定される医療計画の「６事業」に含まれるのはどれか。","r":["71-1-3","70-1-4"],"pp":[27],"modes":["neg"],"T":[{"x":"災害時における医療","o":0},{"x":"小児医療","o":1},{"x":"周産期医療","o":2},{"x":"新興感染症発生・まん延時における医療","o":3}],"F":[{"x":"精神医療","o":4}],"c":[],"n":"都道府県によって策定される医療計画の「６事業」に含まれないのはどれか。"},{"t":"医療計画の５疾病","cat":"社会保障・医療倫理","q":"第８次医療計画における５疾病はどれか。","r":["71-2-2","70-1-3"],"pp":[27],"modes":["pos"],"T":[{"x":"糖尿病","o":0}],"F":[{"x":"慢性呼吸不全","o":1},{"x":"肝不全","o":2},{"x":"腎不全","o":3},{"x":"結核","o":4},{"x":"高血圧症","o":5},{"x":"肺炎","o":6}],"c":[]},{"t":"在宅医療","cat":"社会保障・医療倫理","q":"在宅医療について正しいのはどれか。","r":["71-2-11","71-6-4","70-2-7"],"pp":[27],"modes":   var h='<header class="brand"><div class="stripe" aria-hidden="true"></div><h1>結果</h1></header><section class="panel">'+
    '<div class="score">'+state.score+'<small> / '+n+'問　正答率 '+pct+'%</small></div>'+
    '<div class="row"><button class="ghost" id="again">同じ設定でもう一度</button>'+
    (state.qs.some(function(q){return !q.right})?'<button class="ghost" id="retry">間違えたテーマを解き直す</button>':'')+
    '<button class="ghost" id="home">設定に戻る</button></div></section><h2>見直し</h2><div class="rev">';
  state.qs.forEach(function(q,i){
    h+='<details'+(q.right?'':' open')+'><summary><span class="mk '+(q.right?'ok':'ng')+'">'+(q.right?'○':'×')+'</span>'+(i+1)+'. '+esc(q.t.t)+'</summary><div class="body">'+
      (q.t.c.length?'<div class="case">'+q.t.c.map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+'</div>':'')+
      '<div>'+esc(q.stem)+(q.need===2?'（２つ選べ）':'')+'</div><ol>'+
      q.items.map(function(it,k){var cls=it.c?'a':(q.chosen.indexOf(k)>=0?'w':'');return '<li class="'+cls+'">'+esc(it.x)+'</li>'}).join('')+'</ol>'+answerHtml(q)+'</div></details>';
  });
  h+='</div>';
  app.innerHTML=h; window.scrollTo(0,0);
  var ts=state.qs.map(function(q){return q.t});
  document.getElementById('again').onclick=function(){var p=DATA.filter(function(t){return store.cats.indexOf(t.cat)>=0&&(!state.onlyMiss||store.miss[t.t])});start(pick(p,store.n))};
  var r=document.getElementById('retry'); if(r) r.onclick=function(){start(shuffle(state.qs.filter(function(q){return !q.right}).map(function(q){return q.t})))};
  document.getElementById('home').onclick=function(){setup();window.scrollTo(0,0)};
}
setup();
})();
</script>

</body>
</html>
